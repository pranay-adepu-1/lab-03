<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 521" width="850" height="521">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
