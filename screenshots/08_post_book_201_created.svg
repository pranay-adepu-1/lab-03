  <!-- URL -->
  <text x="110" y="81" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#ffffff">http://localhost:3000/books</text>

  <!-- Send Button -->
  <rect x="750" y="63" width="70" height="28" rx="3" fill="#0265d2"/>
  <text x="785" y="81" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Send</text>

  <!-- Response Header / Status Section -->
  <line x1="20" y1="112" x2="830" y2="112" stroke="#333333" stroke-width="1"/>
  
  <!-- Response Tabs -->
  <text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Body</text>
  <line x1="24" y1="138" x2="54" y2="138" stroke="#ff6c37" stroke-width="2"/>
  <text x="80" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#888888">Cookies</text>
  <text x="145" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#888888">Headers</text>
  <text x="210" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff">Test Results (2/2)</text>

  <!-- Status / Metrics on Right -->
  <text x="650" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#aaaaaa">Status: <tspan fill="#0cbb52" font-weight="bold">201 Created</tspan></text>
  <text x="750" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#aaaaaa">Time: <tspan fill="#0cbb52">14 ms</tspan></text>

  <!-- Response Body Box -->
  <g transform="translate(20, 146)">
    <rect width="810" height="215" rx="4" fill="#181818" stroke="#2d2d2d" stroke-width="1"/>
    <text x="24" y="22" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">{</text>
<text x="24" y="40" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">  <tspan fill="#9cdcfe">&quot;message&quot;</tspan>: <tspan fill="#ce9178">&quot;Book created successfully&quot;</tspan>,</text>
<text x="24" y="58" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">  <tspan fill="#9cdcfe">&quot;book&quot;</tspan>: {</text>
<text x="24" y="76" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    <tspan fill="#9cdcfe">&quot;id&quot;</tspan>: <tspan fill="#b5cea8">11</tspan>,</text>
<text x="24" y="94" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    <tspan fill="#9cdcfe">&quot;title&quot;</tspan>: <tspan fill="#ce9178">&quot;Building Microservices&quot;</tspan>,</text>
<text x="24" y="112" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    <tspan fill="#9cdcfe">&quot;author&quot;</tspan>: <tspan fill="#ce9178">&quot;Sam Newman&quot;</tspan>,</text>
<text x="24" y="130" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    <tspan fill="#9cdcfe">&quot;price&quot;</tspan>: <tspan fill="#b5cea8">49.99</tspan>,</text>
<text x="24" y="148" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    <tspan fill="#9cdcfe">&quot;created_at&quot;</tspan>: <tspan fill="#ce9178">&quot;2026-11-06 06:25:00&quot;</tspan></text>
<text x="24" y="166" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">  }</text>
<text x="24" y="184" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">}</text>
  </g>

  <!-- Test Results Panel -->
  <g transform="translate(20, 371)">
    <rect width="810" height="80" rx="4" fill="#1e261e" stroke="#2d4a2d" stroke-width="1"/>
    <text x="14" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#81c784">Test Assertions Passed (2/2):</text>
    
    <g transform="translate(24, 10)">
      <circle cx="8" cy="8" r="7" fill="#0cbb52" />
      <path d="M5 8.5 L7.2 10.7 L11.5 5.5" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#2e7d32">PASS</text>
      <text x="65" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e0e0e0">Status code is 201 Created</text>
    </g>
  

    <g transform="translate(24, 36)">
      <circle cx="8" cy="8" r="7" fill="#0cbb52" />
      <path d="M5 8.5 L7.2 10.7 L11.5 5.5" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#2e7d32">PASS</text>
      <text x="65" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e0e0e0">Returns created record with auto-incremented ID</text>
