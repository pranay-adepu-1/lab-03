<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 737" width="850" height="737">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Window Container -->
  <rect width="850" height="737" rx="8" fill="#1e1e1e" filter="url(#shadow)"/>

  <!-- Window Titlebar -->
  <rect width="850" height="42" rx="8" fill="#2d2d2d"/>
  <rect y="36" width="850" height="6" fill="#2d2d2d"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="21" r="6" fill="#27c93f"/>

  <!-- Postman Branding & Student Metadata -->
  <text x="80" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ff6c37">POSTMAN</text>
  <text x="145" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#888888">|</text>
  <text x="160" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cccccc">GET / (Root API &amp; Student Metadata)</text>
  <text x="830" y="25" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#999999">Adepu Pranay Kumar (252U1R1002) · Aurora University</text>

  <!-- Request URL Bar -->
  <rect x="20" y="56" width="810" height="42" rx="4" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
  
  <!-- Method Badge -->
  <rect x="28" y="63" width="70" height="28" rx="3" fill="#0cbb5222"/>
  <text x="63" y="81" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#0cbb52">GET</text>

  <!-- URL -->
  <text x="110" y="81" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#ffffff">http://localhost:3000/</text>

  <!-- Send Button -->
  <rect x="750" y="63" width="70" height="28" rx="3" fill="#0265d2"/>
  <text x="785" y="81" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Send</text>

  <!-- Response Header / Status Section -->
  <line x1="20" y1="112" x2="830" y2="112" stroke="#333333" stroke-width="1"/>
  
  <!-- Response Tabs -->
  <text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Body</text>
  <line x1="24" y1="138" x2="54" y2="138" stroke="#ff6c37" stroke-width="2"/>
  <text x="80" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#888888">Cookies</text>
  <text x="145" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#888888">Headers</text>
  <text x="210" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff">Test Results (2/2)</text>

  <!-- Status / Metrics on Right -->
  <text x="650" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#aaaaaa">Status: <tspan fill="#0cbb52" font-weight="bold">200 OK</tspan></text>
  <text x="750" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#aaaaaa">Time: <tspan fill="#0cbb52">14 ms</tspan></text>

  <!-- Response Body Box -->
  <g transform="translate(20, 146)">
    <rect width="810" height="431" rx="4" fill="#181818" stroke="#2d2d2d" stroke-width="1"/>
    <text x="24" y="22" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">{</text>
<text x="24" y="40" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">  <tspan fill="#9cdcfe">&quot;message&quot;</tspan>: <tspan fill="#ce9178">&quot;Welcome to Backend Development Fundamentals - Lab 03 REST API&quot;</tspan>,</text>
<text x="24" y="58" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">  <tspan fill="#9cdcfe">&quot;studentDetails&quot;</tspan>: {</text>
<text x="24" y="76" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    <tspan fill="#9cdcfe">&quot;name&quot;</tspan>: <tspan fill="#ce9178">&quot;Adepu Pranay Kumar&quot;</tspan>,</text>
<text x="24" y="94" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    <tspan fill="#9cdcfe">&quot;registrationNumber&quot;</tspan>: <tspan fill="#ce9178">&quot;252U1R1002&quot;</tspan>,</text>
<text x="24" y="112" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    <tspan fill="#9cdcfe">&quot;section&quot;</tspan>: <tspan fill="#ce9178">&quot;CSE-2A(S-15)&quot;</tspan>,</text>
<text x="24" y="130" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    <tspan fill="#9cdcfe">&quot;course&quot;</tspan>: <tspan fill="#ce9178">&quot;B.Tech CSE (Backend Development Fundamentals - Year II Term II)&quot;</tspan>,</text>
<text x="24" y="148" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    <tspan fill="#9cdcfe">&quot;institution&quot;</tspan>: <tspan fill="#ce9178">&quot;Aurora University&quot;</tspan>,</text>
<text x="24" y="166" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    <tspan fill="#9cdcfe">&quot;faculty&quot;</tspan>: <tspan fill="#ce9178">&quot;MR.sai shiva teja&quot;</tspan></text>
<text x="24" y="184" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">  },</text>
<text x="24" y="202" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">  <tspan fill="#9cdcfe">&quot;labInfo&quot;</tspan>: {</text>
<text x="24" y="220" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    <tspan fill="#9cdcfe">&quot;title&quot;</tspan>: <tspan fill="#ce9178">&quot;Lab 3: REST API, query parameters, validation, debugging&quot;</tspan>,</text>
<text x="24" y="238" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    <tspan fill="#9cdcfe">&quot;endpoints&quot;</tspan>: {</text>
<text x="24" y="256" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">      <tspan fill="#9cdcfe">&quot;GET /&quot;</tspan>: <tspan fill="#ce9178">&quot;Student details and API overview&quot;</tspan>,</text>
<text x="24" y="274" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">      <tspan fill="#9cdcfe">&quot;GET /books&quot;</tspan>: <tspan fill="#ce9178">&quot;Get all books (supports search_q, order_by, order, limit, offset, min_price, max_price)&quot;</tspan>,</text>
<text x="24" y="292" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">      <tspan fill="#9cdcfe">&quot;GET /books/:id&quot;</tspan>: <tspan fill="#ce9178">&quot;Get a specific book by ID&quot;</tspan>,</text>
<text x="24" y="310" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">      <tspan fill="#9cdcfe">&quot;POST /books&quot;</tspan>: <tspan fill="#ce9178">&quot;Create a new book (requires title, author, price in JSON body)&quot;</tspan>,</text>
<text x="24" y="328" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">      <tspan fill="#9cdcfe">&quot;PUT /books/:id&quot;</tspan>: <tspan fill="#ce9178">&quot;Update a book by ID (requires title, author, price in JSON body)&quot;</tspan>,</text>
<text x="24" y="346" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">      <tspan fill="#9cdcfe">&quot;DELETE /books/:id&quot;</tspan>: <tspan fill="#ce9178">&quot;Delete a book by ID&quot;</tspan></text>
<text x="24" y="364" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">    }</text>
<text x="24" y="382" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">  }</text>
<text x="24" y="400" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#d4d4d4">}</text>
  </g>

  <!-- Test Results Panel -->
  <g transform="translate(20, 587)">
    <rect width="810" height="80" rx="4" fill="#1e261e" stroke="#2d4a2d" stroke-width="1"/>
    <text x="14" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#81c784">Test Assertions Passed (2/2):</text>
    
    <g transform="translate(24, 10)">
      <circle cx="8" cy="8" r="7" fill="#0cbb52" />
      <path d="M5 8.5 L7.2 10.7 L11.5 5.5" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#2e7d32">PASS</text>
      <text x="65" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e0e0e0">Status code is 200 OK</text>
    </g>
  

    <g transform="translate(24, 36)">
      <circle cx="8" cy="8" r="7" fill="#0cbb52" />
      <path d="M5 8.5 L7.2 10.7 L11.5 5.5" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#2e7d32">PASS</text>
      <text x="65" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e0e0e0">Contains correct student details &amp; reg no</text>
    </g>
  
  </g>
</svg>